name: GamingNewsroom V2

on:
  schedule:
    - cron: "0 7-23 * * *"
      timezone: "Asia/Dhaka"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gamingnewsroom-v2
  cancel-in-progress: false

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      CEREBRAS_API_KEY_1: ${{ secrets.CEREBRAS_API_KEY_1 }}
      CEREBRAS_API_KEY_2: ${{ secrets.CEREBRAS_API_KEY_2 }}
      CEREBRAS_API_KEY_3: ${{ secrets.CEREBRAS_API_KEY_3 }}
      CEREBRAS_API_KEY_4: ${{ secrets.CEREBRAS_API_KEY_4 }}
      CEREBRAS_API_KEY_5: ${{ secrets.CEREBRAS_API_KEY_5 }}
      CEREBRAS_API_KEY_6: ${{ secrets.CEREBRAS_API_KEY_6 }}
      CEREBRAS_API_KEY_7: ${{ secrets.CEREBRAS_API_KEY_7 }}
      CEREBRAS_API_KEY_8: ${{ secrets.CEREBRAS_API_KEY_8 }}
      CEREBRAS_API_KEY_9: ${{ secrets.CEREBRAS_API_KEY_9 }}
      CEREBRAS_API_KEY_10: ${{ secrets.CEREBRAS_API_KEY_10 }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: "@GamingNewsroom"
      NEWS_MODE: "update"
      PYTHONUNBUFFERED: "1"
      PUBLISH_SCORE_THRESHOLD: "80"
      MAX_POSTS_PER_RUN: "20"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python source
        run: python -m py_compile main.py

      - name: Run self-test
        run: python main.py --self-test

      - name: Run GamingNewsroom
        run: python main.py

      - name: Save state
        if: always()
        run: |
          git config user.name "Gaming News Bot"
          git config user.email "actions@github.com"
          git add news_state.json posted_urls.txt

          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "Update GamingNewsroom state"
            git push
          fi
