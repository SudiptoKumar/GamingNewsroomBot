name: Gaming News

on:
  schedule:
    - cron: "0 7-23 * * *"
      timezone: "Asia/Dhaka"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gaming-news
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
      CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHANNEL: "@GamingNewsroom"
      CEREBRAS_MODEL: "gpt-oss-120b"
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Verify repository
        run: |
          set -eu
          for required in \
            main.py \
            README.md \
            requirements.txt \
            news_state.json \
            posted_urls.txt \
            .github/workflows/newbot.yml
          do
            test -f "$required" || { echo "Missing required file: $required"; exit 1; }
          done
          echo "Required Gaming News files are present."

      - name: Compile
        run: python -m py_compile main.py

      - name: Self-test
        run: python main.py --self-test

      - name: Publish Gaming News
        run: python main.py

      - name: Save state
        if: success()
        run: |
          git config user.name "Gaming News"
          git config user.email "actions@github.com"
          git add news_state.json posted_urls.txt
          if git diff --cached --quiet; then
            echo "No state changes."
          else
            git commit -m "Update Gaming News state"
            git push
          fi
