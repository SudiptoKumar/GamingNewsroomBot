name: GamingNewsroom

on:
  workflow_dispatch:
  schedule:
    - cron: "0 13 * * *"

permissions:
  contents: write

jobs:
  run-news-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Compile
        run: python -m py_compile main.py config.py models.py state.py discovery.py editorial.py publisher.py

      - name: Self-test
        run: python main.py --self-test
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@GamingNewsroom"

      - name: Run
        run: python main.py
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: "@GamingNewsroom"
          CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL }}

      - name: Save state
        if: always()
        run: |
          git config user.name "gamingnewsroom-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gaming_state.json posted_urls.txt
          git diff --cached --quiet || git commit -m "chore: update GamingNewsroom state"
          git push
