name: GamingNewsroom V1

on:
  workflow_dispatch:
  schedule:
    - cron: '0 13 * * *'

concurrency:
  group: gamingnewsroom
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m py_compile *.py
      - name: Self-test
        env:
          EXA_API_KEY: test
          CEREBRAS_API_KEY: test
          TELEGRAM_BOT_TOKEN: test
          TELEGRAM_CHANNEL: '@GamingNewsroom'
        run: python main.py --self-test
          python test_integration.py
      - name: Run GamingNewsroom
        env:
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          CEREBRAS_API_KEY: ${{ secrets.CEREBRAS_API_KEY }}
          CEREBRAS_MODEL: ${{ secrets.CEREBRAS_MODEL || 'gpt-oss-120b' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHANNEL: ${{ secrets.TELEGRAM_CHANNEL || '@GamingNewsroom' }}
        run: python main.py
      - name: Save persistent state
        if: always()
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add gaming_state.json posted_urls.txt
          git diff --cached --quiet || git commit -m 'Update GamingNewsroom state'
          git push
